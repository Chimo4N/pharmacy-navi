<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>くすりナビ TOKYO</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F7F3;
    --bg-card:#FFFFFF;
    --bg-tab:#E4ECE4;
    --bg-tab-active:#2A6F77;
    --ink:#22303A;
    --ink-soft:#5B6B70;
    --accent:#2A6F77;
    --accent-soft:#DCEBEA;
    --warn:#C1502E;
    --warn-soft:#F7E4DC;
    --track:#D7E2D7;
    --line:#D8E1D6;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', -apple-system, 'Hiragino Sans', 'Noto Sans TC', sans-serif;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:960px;margin:0 auto;padding:0 20px;}
  a{color:inherit;}

  /* Header */
  header{
    padding:28px 0 18px;
    border-bottom:1px solid var(--line);
  }
  .header-row{
    display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .mark{
    width:40px;height:40px;flex:none;border-radius:10px;
    background:var(--accent);
    display:flex;align-items:center;justify-content:center;
  }
  .mark svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round;}
  .site-name{font-weight:900;font-size:1.32rem;letter-spacing:.01em;margin:0;}
  .tagline{margin:2px 0 0;color:var(--ink-soft);font-size:.86rem;}
  .lang-switch{display:flex;gap:6px;flex-wrap:wrap;}
  .lang-btn{
    border:1px solid var(--line);background:#fff;color:var(--ink-soft);
    padding:7px 13px;border-radius:999px;font-size:.82rem;font-weight:500;
    cursor:pointer;transition:background .15s, color .15s, border-color .15s;
    font-family:inherit;
  }
  .lang-btn:hover{border-color:var(--accent);}
  .lang-btn.active{background:var(--ink);color:#fff;border-color:var(--ink);}

  .pharmacist-note{
    margin-top:14px;font-size:.78rem;color:var(--ink-soft);
    display:inline-flex;align-items:center;gap:6px;
  }
  .pharmacist-note::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);}

  /* Hero */
  .hero{padding:30px 0 8px;}
  .hero p{max-width:60ch;font-size:1rem;color:var(--ink);}

  /* Ad placeholder */
  .ad-slot{
    margin:26px 0;
    border:1.5px dashed #B9C7B7;
    border-radius:var(--radius);
    padding:16px;
    text-align:center;
    font-size:.78rem;
    color:var(--ink-soft);
    background:repeating-linear-gradient(135deg, rgba(0,0,0,.015) 0 10px, transparent 10px 20px);
  }

  /* Tabs */
  .tabs{
    position:sticky;top:0;z-index:10;
    background:rgba(244,247,243,.92);
    backdrop-filter:blur(6px);
    padding:14px 0;
    margin-top:10px;
    border-bottom:1px solid var(--line);
  }
  .tabs-label{font-size:.74rem;color:var(--ink-soft);margin:0 0 8px;font-weight:500;}
  .tab-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;}
  .tab-btn{
    flex:none;
    display:flex;align-items:center;gap:8px;
    background:var(--bg-tab);
    border:1px solid transparent;
    color:var(--ink);
    padding:9px 14px;
    border-radius:999px;
    font-size:.86rem;font-weight:500;
    cursor:pointer;font-family:inherit;
    transition:background .18s, color .18s;
    white-space:nowrap;
  }
  .tab-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
  .tab-btn.active{background:var(--bg-tab-active);color:#fff;}

  /* Panel */
  .panel{padding:26px 0 10px;}
  .panel.fade{opacity:0;transform:translateY(6px);}
  .panel{transition:opacity .22s ease, transform .22s ease;}
  .symptom-title{font-size:1.5rem;font-weight:900;margin:0 0 6px;}
  .symptom-desc{color:var(--ink-soft);font-size:.9rem;max-width:62ch;margin:0 0 22px;}

  .grid{
    display:grid;grid-template-columns:repeat(auto-fill, minmax(270px,1fr));
    gap:16px;
  }
  .card{
    background:var(--bg-card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px 18px 16px;
    position:relative;
  }
  .card::before{
    content:"";position:absolute;top:0;left:18px;right:18px;height:0;
    border-top:1.5px dashed #CBD8C9;
  }
  .prod-name{font-weight:700;font-size:1.02rem;margin:6px 0 2px;}
  .prod-ingredient{font-size:.74rem;color:var(--accent);font-weight:500;margin:0 0 10px;}
  .prod-desc{font-size:.85rem;color:var(--ink);margin:0 0 14px;}

  .gauge-block{margin-bottom:10px;}
  .gauge-label{font-size:.72rem;color:var(--ink-soft);margin:0 0 4px;font-weight:500;}
  .gauge-row{display:flex;align-items:center;gap:8px;}
  .gauge-end{font-size:.68rem;color:var(--ink-soft);flex:none;width:34px;}
  .gauge-end.right{text-align:right;}
  .gauge-bar{flex:1;display:flex;gap:3px;height:8px;}
  .seg{flex:1;border-radius:3px;background:var(--track);}
  .seg.filled{background:var(--accent);}

  .caution{
    display:flex;gap:6px;align-items:flex-start;
    background:var(--warn-soft);color:#8A3B22;
    border-radius:8px;padding:8px 10px;margin:12px 0 12px;
    font-size:.76rem;
  }
  .caution svg{width:14px;height:14px;flex:none;margin-top:2px;stroke:#8A3B22;fill:none;stroke-width:2.4;}

  .prod-meta{border-top:1px solid var(--line);margin-top:12px;padding-top:10px;}
  .meta-row{display:flex;gap:8px;font-size:.76rem;margin-bottom:5px;}
  .meta-row .k{color:var(--ink-soft);flex:none;width:76px;}
  .meta-row .v{font-family:'JetBrains Mono', monospace;font-size:.72rem;font-weight:500;letter-spacing:-.01em;}
  .meta-row.buy .v{font-family:inherit;font-weight:500;}

  /* Disclaimer */
  .disclaimer{
    margin:34px 0 0;
    border-left:3px solid var(--accent);
    background:var(--accent-soft);
    border-radius:0 10px 10px 0;
    padding:16px 18px;
  }
  .disclaimer h3{margin:0 0 6px;font-size:.92rem;}
  .disclaimer p{margin:0;font-size:.8rem;color:var(--ink);}

  /* Summary table */
  .summary{margin:40px 0 0;}
  .summary h2{font-size:1.2rem;margin:0 0 4px;}
  .summary .lead{color:var(--ink-soft);font-size:.85rem;margin:0 0 16px;}
  table{width:100%;border-collapse:collapse;font-size:.84rem;}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);}
  th{color:var(--ink-soft);font-weight:500;font-size:.74rem;}
  td.sym-cell{white-space:nowrap;color:var(--ink-soft);}

  footer{
    margin:44px 0 30px;padding-top:18px;border-top:1px solid var(--line);
    font-size:.76rem;color:var(--ink-soft);
    display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;
  }

  @media (max-width:560px){
    .header-row{flex-direction:column;}
    .meta-row .k{width:64px;}
  }
</style>
</head>

/* ---------- State ---------- */
let currentLang = "ja";
let currentSymptom = symptoms[0].id;

function t(key){ return translations[currentLang][key]; }

/* ---------- Renderers ---------- */
function renderGauge(level, lowLabel, highLabel, title){
  let segs = "";
  for(let i=1;i<=5;i++){
    segs += `<div class="seg${i<=level?" filled":""}"></div>`;
  }
  return `
    <div class="gauge-block">
      <p class="gauge-label">${title}</p>
      <div class="gauge-row">
        <span class="gauge-end">${lowLabel}</span>
        <div class="gauge-bar">${segs}</div>
        <span class="gauge-end right">${highLabel}</span>
      </div>
    </div>`;
}

function productCard(p){
  const cautionHtml = p.caution ? `
    <div class="caution">
      <svg viewBox="0 0 24 24"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17h.01"/></svg>
      <span>${p.caution[currentLang]}</span>
    </div>` : "";
  return `
    <div class="card">
      <p class="prod-name">${p.name}</p>
      <p class="prod-ingredient">${t("ingredientLabel")}：${p.ingredient[currentLang]}</p>
      <p class="prod-desc">${p.desc[currentLang]}</p>
      ${renderGauge(p.strength, t("weakEnd"), t("strongEnd"), t("strengthLabel"))}
      ${renderGauge(p.drowsy, t("drowsyLessEnd"), t("drowsyMoreEnd"), t("drowsyLabel"))}
      ${cautionHtml}
      <div class="prod-meta">
        <div class="meta-row"><span class="k">${t("dosageLabel")}</span><span class="v">${p.dosage[currentLang]}</span></div>
        <div class="meta-row buy"><span class="k">${t("buyLabel")}</span><span class="v">${buyLabels[p.buy][currentLang]}</span></div>
      </div>
    </div>`;
}

function renderTabs(){
  const row = document.getElementById("tabRow");
  row.innerHTML = symptoms.map(s => `
    <button class="tab-btn${s.id===currentSymptom?" active":""}" data-id="${s.id}">
      <svg viewBox="0 0 24 24">${icons[s.id]}</svg>
      ${s.title[currentLang]}
    </button>`).join("");
  row.querySelectorAll(".tab-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      if(btn.dataset.id === currentSymptom) return;
      currentSymptom = btn.dataset.id;
      renderTabs();
      renderPanel(true);
    });
  });
}

function renderPanel(animate){
  const panel = document.getElementById("panel");
  const s = symptoms.find(x=>x.id===currentSymptom);
  const html = `
    <h2 class="symptom-title">${s.title[currentLang]}</h2>
    <p class="symptom-desc">${s.desc[currentLang]}</p>
    <div class="grid">${s.products.map(productCard).join("")}</div>`;
  if(animate){
    panel.classList.add("fade");
    setTimeout(()=>{
      panel.innerHTML = html;
      panel.classList.remove("fade");
    }, 140);
  } else {
    panel.innerHTML = html;
  }
}

function renderSummary(){
  const body = document.getElementById("summaryBody");
  let rows = "";
  symptoms.forEach(s=>{
    s.products.forEach(p=>{
      rows += `<tr><td class="sym-cell">${s.title[currentLang]}</td><td>${p.name}</td><td>${buyLabels[p.buy][currentLang]}</td></tr>`;
    });
  });
  body.innerHTML = rows;
}

function renderLangSwitch(){
  const el = document.getElementById("langSwitch");
  el.innerHTML = Object.keys(langNames).map(l=>`
    <button class="lang-btn${l===currentLang?" active":""}" data-lang="${l}">${langNames[l]}</button>
  `).join("");
  el.querySelectorAll(".lang-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      if(btn.dataset.lang === currentLang) return;
      currentLang = btn.dataset.lang;
      renderAll();
    });
  });
}

function renderAll(){
  document.documentElement.lang = currentLang;
  document.getElementById("siteName").textContent = t("siteName");
  document.getElementById("tagline").textContent = t("tagline");
  document.getElementById("pharmacistNote").textContent = t("pharmacistNote");
  document.getElementById("heroLead").textContent = t("heroLead");
  document.getElementById("tabsLabel").textContent = t("tabsLabel");
  document.getElementById("adSlot1").textContent = t("adPlaceholder");
  document.getElementById("adSlot2").textContent = t("adPlaceholder");
  document.getElementById("disclaimerTitle").textContent = t("disclaimerTitle");
  document.getElementById("disclaimerBody").textContent = t("disclaimerBody");
  document.getElementById("summaryTitle").textContent = t("summaryTitle");
  document.getElementById("summaryIntro").textContent = t("summaryIntro");
  document.getElementById("thSymptom").textContent = t("tableSymptom");
  document.getElementById("thProduct").textContent = t("tableProduct");
  document.getElementById("thBuy").textContent = t("tableBuy");
  document.getElementById("footerCredit").textContent = t("footerCredit");

  renderLangSwitch();
  renderTabs();
  renderPanel(false);
  renderSummary();
}
