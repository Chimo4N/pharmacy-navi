<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ふぁらまーnavi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
  
</head>
<body>
<div class="wrap">
  <header>
    <div class="header-row">
      <div class="brand">
        <div class="mark"><svg viewBox="0 0 24 24"><path d="M6 12c0-3.3 2.7-6 6-6s6 2.7 6 6-2.7 6-6 6"/><path d="M6 12c0 3.3 2.7 6 6 6"/><path d="M12 6v12" stroke-dasharray="1 3"/></svg></div>
        <div>
          <p class="site-name" id="siteName"></p>
          <p class="tagline" id="tagline"></p>
        </div>
      </div>
      <div class="lang-switch" id="langSwitch"></div>
    </div>
    <p class="pharmacist-note" id="pharmacistNote"></p>
  </header>

  <div class="hero">
    <p id="heroLead"></p>
  </div>

  <div class="quiz-section" id="quizSection">
    <h2 class="quiz-title" id="quizTitle"></h2>
    <p class="quiz-subtitle" id="quizSubtitle"></p>
    <div id="quizBody"></div>
  </div>

  <div class="ad-slot" id="adSlot1"></div>

  <div class="tabs">
    <p class="tabs-label" id="tabsLabel"></p>
    <div class="tab-row" id="tabRow"></div>
  </div>

  <div class="panel" id="panel"></div>

  <div class="ad-slot" id="adSlot2"></div>

  <div class="disclaimer">
    <h3 id="disclaimerTitle"></h3>
    <p id="disclaimerBody"></p>
  </div>

  <div class="summary">
    <h2 id="summaryTitle"></h2>
    <p class="lead" id="summaryIntro"></p>
    <table>
      <thead>
        <tr>
          <th id="thSymptom"></th>
          <th id="thProduct"></th>
          <th id="thBuy"></th>
        </tr>
      </thead>
      <tbody id="summaryBody"></tbody>
    </table>
  </div>

  <div class="picks">
    <h2 id="picksTitle"></h2>
    <p class="lead" id="picksIntro"></p>
    <div class="picks-row" id="picksRow"></div>
  </div>

  <footer>
    <span id="footerCredit"></span>
    <nav class="footer-nav">
      <a href="about.html" id="navAbout"></a>
      <a href="articles.html" id="navArticles"></a>
      <a href="privacy.html" id="navPrivacy"></a>
      <a href="contact.html" id="navContact"></a>
    </nav>
    <span>&copy; 2026 pharama Navi TOKYO</span>
  </footer>
</div>
<script src="script.js" defer></script>
</body>
</html>
