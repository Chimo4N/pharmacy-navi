<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>お問い合わせ | くすりナビ TOKYO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F7F3; --bg-card:#FFFFFF; --bg-tab:#E4ECE4; --ink:#22303A; --ink-soft:#5B6B70;
    --accent:#2A6F77; --accent-soft:#DCEBEA; --warn-soft:#F7E4DC; --line:#D8E1D6; --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:'Zen Kaku Gothic New',-apple-system,'Hiragino Sans','Noto Sans TC',sans-serif;line-height:1.75;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:620px;margin:0 auto;padding:0 20px;}
  a{color:var(--accent);}
  header{padding:28px 0 18px;border-bottom:1px solid var(--line);}
  .header-row{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:12px;}
  .mark{width:40px;height:40px;flex:none;border-radius:10px;background:var(--accent);display:flex;align-items:center;justify-content:center;}
  .mark svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round;}
  .site-name{font-weight:900;font-size:1.1rem;margin:0;}
  .back-link{font-size:.82rem;color:var(--ink-soft);text-decoration:none;display:inline-block;margin-top:2px;}
  .lang-switch{display:flex;gap:6px;flex-wrap:wrap;}
  .lang-btn{border:1px solid var(--line);background:#fff;color:var(--ink-soft);padding:7px 13px;border-radius:999px;font-size:.82rem;font-weight:500;cursor:pointer;font-family:inherit;}
  .lang-btn.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  main{padding:32px 0 10px;}
  h1{font-size:1.6rem;font-weight:900;margin:0 0 6px;}
  .lead{font-size:.9rem;color:var(--ink-soft);margin:0 0 24px;}
  .dev-note{background:var(--warn-soft);border-radius:10px;padding:12px 14px;font-size:.8rem;margin-bottom:24px;color:#8A3B22;}

  .contact-card{background:var(--bg-card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin-bottom:20px;}
  label{display:block;font-size:.82rem;font-weight:500;color:var(--ink-soft);margin:0 0 6px;}
  input,textarea{
    width:100%;border:1.5px solid var(--line);border-radius:9px;padding:10px 12px;
    font-family:inherit;font-size:.9rem;color:var(--ink);margin-bottom:16px;background:#fff;
  }
  textarea{min-height:120px;resize:vertical;}
  input:focus,textarea:focus{outline:none;border-color:var(--accent);}
  .submit-btn{
    background:var(--accent);color:#fff;border:none;padding:12px 22px;border-radius:999px;
    font-size:.9rem;font-weight:700;cursor:pointer;font-family:inherit;
  }
  .submit-btn:hover{opacity:.92;}
  .submit-btn:disabled{opacity:.55;cursor:not-allowed;}
  .form-note{font-size:.76rem;color:var(--ink-soft);margin-top:10px;}
  .form-status{font-size:.85rem;margin-top:12px;padding:10px 12px;border-radius:8px;}
  .form-status.success{background:var(--accent-soft);color:var(--accent);}
  .form-status.error{background:var(--warn-soft);color:#8A3B22;}

  .alt-contact{background:var(--accent-soft);border-radius:10px;padding:16px 18px;font-size:.85rem;}
  .alt-contact .mono{font-family:'JetBrains Mono',monospace;font-weight:500;}

  footer{margin:44px 0 30px;padding-top:18px;border-top:1px solid var(--line);font-size:.76rem;color:var(--ink-soft);display:flex;flex-direction:column;gap:10px;}
  .footer-nav{display:flex;gap:16px;flex-wrap:wrap;}
  .footer-nav a{color:var(--ink-soft);text-decoration:underline;font-size:.76rem;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="header-row">
      <div class="brand">
        <div class="mark"><svg viewBox="0 0 24 24"><path d="M6 12c0-3.3 2.7-6 6-6s6 2.7 6 6-2.7 6-6 6"/><path d="M6 12c0 3.3 2.7 6 6 6"/><path d="M12 6v12" stroke-dasharray="1 3"/></svg></div>
        <div>
          <p class="site-name" id="siteName"></p>
          <a class="back-link" href="index.html" id="backLink"></a>
        </div>
      </div>
      <div class="lang-switch" id="langSwitch"></div>
    </div>
  </header>

  <main>
    <h1 id="pageTitle"></h1>
    <p class="lead" id="lead"></p>
    <div class="contact-card">
      <form id="contactForm">
        <label id="labelName" for="fName"></label>
        <input type="text" id="fName" name="name" required>
        <label id="labelEmail" for="fEmail"></label>
        <input type="email" id="fEmail" name="email" required>
        <label id="labelMessage" for="fMessage"></label>
        <textarea id="fMessage" name="message" required></textarea>
        <button type="submit" class="submit-btn" id="submitBtn"></button>
        <p class="form-note" id="formNote"></p>
        <p class="form-status" id="formStatus" style="display:none;"></p>
      </form>
    </div>

    <div class="alt-contact">
      <p id="altContactLabel" style="margin:0 0 6px;font-weight:700;"></p>
      <p class="mono" style="margin:0;">contact@[y.hachimonji@proton.me]</p>
    </div>
  </main>

  <footer>
    <span id="footerCredit"></span>
    <nav class="footer-nav">
      <a href="index.html" id="navHome"></a>
      <a href="about.html" id="navAbout"></a>
      <a href="privacy.html" id="navPrivacy"></a>
    </nav>
    <span>&copy; 2026 Kusuri Navi TOKYO </span>
  </footer>
</div>

<script>
const translations = {
  ja:{
    siteName:"くすりナビ TOKYO", backLink:"← トップページに戻る",
    pageTitle:"お問い合わせ",
    lead:"サイトの内容や掲載商品についてのご質問、誤りのご指摘などがあれば、下記フォームまたはメールにてお気軽にご連絡ください。",
    labelName:"お名前", labelEmail:"メールアドレス", labelMessage:"お問い合わせ内容",
    submitBtn:"送信する", formNote:"送信いただいた内容は、お問い合わせへの回答のみに利用します。",
    altContactLabel:"メールでのお問い合わせ",
    footerCredit:"企画：yuto.h／監修：石鍋卓望", navHome:"トップページ", navAbout:"このサイトについて", navPrivacy:"プライバシーポリシー",
    sendingMsg:"送信中…", successMsg:"送信しました。ご連絡ありがとうございます。折り返しご連絡いたします。",
    errorMsg:"送信に失敗しました。お手数ですが、下記のメールアドレス宛に直接ご連絡ください。",
    notSetMsg:"（プロトタイプのため）フォームIDがまだ設定されていません。下のメールアドレスへ直接ご連絡ください。"
  },
  en:{
    siteName:"Kusuri Navi TOKYO", backLink:"← Back to home",
    pageTitle:"Contact",
    lead:"If you have questions about this site or the products listed, or notice anything that needs correcting, please reach out using the form below or by email.",
    labelName:"Name", labelEmail:"Email address", labelMessage:"Message",
    submitBtn:"Send", formNote:"What you submit here is used only to respond to your inquiry.",
    altContactLabel:"Contact us by email",
    footerCredit:"Planning: yuto.h / Supervision: 石鍋卓望", navHome:"Home", navAbout:"About Us", navPrivacy:"Privacy Policy",
    sendingMsg:"Sending…", successMsg:"Message sent. Thank you for reaching out — we'll get back to you soon.",
    errorMsg:"Something went wrong sending your message. Please email us directly at the address below.",
    notSetMsg:"This form's ID hasn't been set up yet (prototype). Please email us directly at the address below."
  },
  zh:{
    siteName:"藥品導覽 TOKYO", backLink:"← 返回首頁",
    pageTitle:"聯絡我們",
    lead:"若您對網站內容或刊登商品有任何疑問，或發現有需要更正之處，歡迎透過下方表單或電子郵件與我們聯繫。",
    labelName:"姓名", labelEmail:"電子郵件地址", labelMessage:"詢問內容",
    submitBtn:"送出", formNote:"您所填寫的內容僅用於回覆您的詢問。",
    altContactLabel:"以電子郵件聯絡我們",
    footerCredit:"企劃：yuto.h／監修：石鍋卓望", navHome:"首頁", navAbout:"關於本站", navPrivacy:"隱私權政策",
    sendingMsg:"傳送中…", successMsg:"已送出，感謝您的聯繫，我們會盡快回覆。",
    errorMsg:"傳送失敗，請直接寄信至下方電子郵件地址。",
    notSetMsg:"（原型階段）表單ID尚未設定，請直接寄信至下方電子郵件地址。"
  },
  es:{
    siteName:"Kusuri Navi TOKYO", backLink:"← Volver al inicio",
    pageTitle:"Contacto",
    lead:"Si tiene preguntas sobre este sitio o los productos que aparecen, o si detecta algo que deba corregirse, contáctenos mediante el siguiente formulario o por correo electrónico.",
    labelName:"Nombre", labelEmail:"Correo electrónico", labelMessage:"Mensaje",
    submitBtn:"Enviar", formNote:"Lo que envíe aquí se usa únicamente para responder a su consulta.",
    altContactLabel:"Contáctenos por correo electrónico",
    footerCredit:"Planificación: yuto.h / Supervisión: 石鍋卓望", navHome:"Inicio", navAbout:"Sobre nosotros", navPrivacy:"Política de privacidad",
    sendingMsg:"Enviando…", successMsg:"Mensaje enviado. Gracias por contactarnos — le responderemos pronto.",
    errorMsg:"Hubo un problema al enviar su mensaje. Por favor escríbanos directamente a la dirección de abajo.",
    notSetMsg:"El ID de este formulario aún no está configurado (prototipo). Escríbanos directamente a la dirección de abajo."
  }
};
const langNames = {ja:"日本語", en:"English", zh:"繁體中文", es:"Español"};
let currentLang = "ja";
try{ const saved = localStorage.getItem("kn_lang"); if(saved && translations[saved]) currentLang = saved; }catch(e){}

function t(key){ return translations[currentLang][key]; }

function renderLangSwitch(){
  const el = document.getElementById("langSwitch");
  el.innerHTML = Object.keys(langNames).map(l=>`<button class="lang-btn${l===currentLang?" active":""}" data-lang="${l}">${langNames[l]}</button>`).join("");
  el.querySelectorAll(".lang-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      if(btn.dataset.lang === currentLang) return;
      currentLang = btn.dataset.lang;
      try{ localStorage.setItem("kn_lang", currentLang); }catch(e){}
      renderAll();
    });
  });
}

function renderAll(){
  document.documentElement.lang = currentLang;
  document.title = t("pageTitle") + " | " + t("siteName");
  [
    "siteName","backLink","pageTitle","lead","devNote",
    "labelName","labelEmail","labelMessage","submitBtn","formNote","altContactLabel",
    "footerCredit","navHome","navAbout","navPrivacy"
  ].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.textContent = t(id);
  });
  renderLangSwitch();
}
renderAll();

/* ---------- Formspree ---------- */
// ↓↓↓ Replace YOUR_FORM_ID with your own Formspree form ID (from formspree.io) ↓↓↓
const FORMSPREE_ENDPOINT = "https://formspree.io/f/YOUR_FORM_ID";

const form = document.getElementById("contactForm");
const submitBtn = document.getElementById("submitBtn");
const statusEl = document.getElementById("formStatus");

function showStatus(kind, message){
  statusEl.textContent = message;
  statusEl.className = "form-status " + kind;
  statusEl.style.display = "block";
}

form.addEventListener("submit", async (e)=>{
  e.preventDefault();

  if(FORMSPREE_ENDPOINT.includes("YOUR_FORM_ID")){
    showStatus("error", t("notSetMsg"));
    return;
  }

  submitBtn.disabled = true;
  showStatus("success", t("sendingMsg"));

  try{
    const res = await fetch(FORMSPREE_ENDPOINT, {
      method: "POST",
      headers: { "Accept": "application/json" },
      body: new FormData(form)
    });
    if(res.ok){
      showStatus("success", t("successMsg"));
      form.reset();
    } else {
      showStatus("error", t("errorMsg"));
    }
  } catch(err){
    showStatus("error", t("errorMsg"));
  } finally {
    submitBtn.disabled = false;
  }
});
</script>
</body>
</html>
